<app-limit-selector [(limit)]="limit" (limitChange)="pagina.set(1)"></app-limit-selector>
<app-searchbox [(value)]="ricerca" (valueChange)="pagina.set(1)"></app-searchbox>
<div class="grid">
  <ng-content select="[grid-header]"></ng-content>
  @for (item of items(); track item.id) {
  <ng-container
    [ngTemplateOutlet]="template()"
    [ngTemplateOutletContext]="{ items: item }"
  ></ng-container>
  }
</div>

<app-pagination
  [currentpage]="pagina()"
  [numberpage]="numeroPagine()"
  (changepage)="pagina.set($event)"
></app-pagination>
