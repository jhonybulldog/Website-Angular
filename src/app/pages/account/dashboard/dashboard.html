<div class="container">
  <div class="dashboard-container">
    <h1>Dashboard</h1>

    <section class="profilo-utente">
      <h2>Profilo utente</h2>

      <div class="profilo-contenuto">
        <div class="immagine-profilo">
          <img [src]="immagineProfilo" alt="Immagine profilo" />
        </div>

        <div class="dati-utente">
          <div class="dato-utente">
            <strong>Nome utente</strong>
            <span>{{ nomeUtente() }}</span>
          </div>

          <div class="dato-utente">
            <strong>Password</strong>
            <span>********</span>
          </div>
        </div>
      </div>
    </section>
    <a routerLink="/dashboard/last-purchases" routerLinkActive="active">accedi hai tuoi ultimi acquisti</a>
    <a routerLink="/dashboard/category-fav" routerLinkActive="active">scegli le tue categorie favorite</a>
    <a routerLink="/dashboard/product-fav" routerLinkActive="active"
      >visualizza i tuoi prodotti favoriti</a
    >
    <a routerLink="/dashboard/my-blog" routerLinkActive="active">Guarda i tuoi Blog postati</a>
  </div>
</div>
