<div class="todos-page">
  <div class="todos-header">
  <h2>Todos</h2>
  <h2 class="section-title">finisci le tue task!</h2>
</div>
  <app-paginated-grid
    [items]="todos()"
    [total]="totale()"
    (load)="carica($event)"
  >
    <ng-template let-todo="items">
      <div class="todo" [class.done]="todo.completed">
        <span>{{ todo.todo }}</span>
        <button (click)="toggle(todo)">
          {{ todo.completed ? "Annulla" : "Segna come fatto" }}
        </button>
      </div>
    </ng-template>
  </app-paginated-grid>
</div>
