<div class="pagination">
  <button
    (click)="goA(currentpage() - 1)"
    [disabled]="currentpage() === 1"
  >
    ←
  </button>

  @for (page of pages(); track page) {
    <button
      [class.active]="currentpage() === page"
      (click)="goA(page)"
    >
      {{ page }}
    </button>
  }

  <button
    (click)="goA(currentpage() + 1)"
    [disabled]="currentpage() === numberpage()"
  >
    →
  </button>
</div>
