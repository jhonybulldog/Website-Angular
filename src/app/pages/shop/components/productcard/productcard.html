<div class="container">
  <div class="prodotti-card">
    @if(loggedIn()){
    <button class="favorite-btn" (click)="toggleFavorite()">
      {{ (isfavorite$ | async) ? "♥" : "♡" }}
    </button>
    }
    <div class="prodotti-image">
      <img [routerLink]="['/shop', proddi().id]" [src]="proddi().thumbnail" alt="{{proddi().title}}" />
    </div>
    <div class="prodotti-info">
      <a [routerLink]="['/shop', proddi().id]">{{proddi().title}}</a>
      <a [routerLink]="['/shop', proddi().id]">{{proddi().price}} €</a>
    </div>
    @if(compareActive$ | async){
      <button (click)="toggleCompare()">{{(isCompare$ | async ) ?  "rimuovi": "compara"}}</button>
    }
    @if (nelCarrello()) { <span class="nel-carrello">Nel carrello</span> }
    <button (click)="openModal()">visualizza</button>
    @if(loggedIn()){
    <button
      class="add-to-cart btn btn-primary"
      (click)="aggiungicarrello(proddi())"
    >
      Aggiungi al carrello
    </button>}@else{
      <button class="add-to-cart" [routerLink]="['/login']">Accedi per acquistare</button>
    }
  </div>
</div>
