  <div class="product-overlay">
    <div class="product-nav-links">
        <button (click)="dialogRef.close()">X</button>    
    </div>
    <h2 class="product-title">{{ data.title }}</h2>
    <p class="product-subtitles">{{ data.description }}</p>
    <p class="product-price">{{ data.price }} €</p>
  </div>
  <img class="product-image" [src]="data.thumbnail" [alt]="data.title"/>

   @if(loggedIn()){
    <button
      class="add-to-cart btn btn-primary"
      (click)="addtoCart(data.id)"
    >
      Aggiungi al carrello
    </button>}@else{
      <button class="add-to-cart" [routerLink]="['/login']">Accedi per acquistare</button>
    }
