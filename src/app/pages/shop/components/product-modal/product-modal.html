@if (prodotto$ | async; as prodotto) {
<div class="product-overlay">
  <div class="product-nav-links">
    <button (click)="dialogRef.close()">X</button>
  </div>
  <h2 class="product-title">{{ prodotto.title }}</h2>
  <p class="product-subtitles">{{ prodotto.description }}</p>
  <p class="product-price">{{ prodotto.price }} €</p>
</div>
<img class="product-image" [src]="prodotto.thumbnail" [alt]="prodotto.title" />

@if (loggedIn()) {
<button class="add-to-cart btn btn-primary" (click)="addtoCart(prodotto.id)">
  Aggiungi al carrello
</button>
} @else {
<button class="add-to-cart" [routerLink]="['/login']">Accedi per acquistare</button>
}
} @else {
<div class="loading">
  <span class="spinner"></span>
  caricamento prodotto...
</div>
}
