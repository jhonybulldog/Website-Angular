<app-limit-selector
  [(limit)]="limit"
  (limitChange)="caricaPagina(1)"
></app-limit-selector>

<div class="prodotti-grid">
  @for (prodotto of prodottiPagina(); track prodotto.id) {
  <app-productcard [proddi]="prodotto"></app-productcard>
  }
</div>

<app-pagination
  [currentpage]="paginaCorrente()"
  [numberpage]="numeroPagine()"
  (changepage)="caricaPagina($event)"
></app-pagination>
