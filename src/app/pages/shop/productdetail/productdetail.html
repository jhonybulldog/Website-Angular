<div class="container">
  <div class="product-overlay">
    <h2 class="product-title">{{prodotto?.nome}}</h2>
    <p class="product-subtitles">{{prodotto?.desc }}</p>
    <p class="product-proce">{{prodotto?.prezzo}} €</p>
  </div>
  <img class="product-image" [src]="prodotto?.immagine" />
  <button class="add-to-cart btn btn-primary" (click)="aggiungicarrello()">Aggiungi al carrello</button>
  <a class="cart-fab" routerLink="/shop/cart">Carrello</a>
</div>
