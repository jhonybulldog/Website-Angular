<div class="container">
  <div class="product-overlay">
    <h2 class="product-title">{{prodotto?.title}}</h2>
    <p class="product-subtitles">{{prodotto?.description }}</p>
    <p class="product-proce">{{prodotto?.price}} €</p>
  </div>
  <img class="product-image" [src]="prodotto?.thumbnail" [alt]="prodotto?.title || 'Prodotto'" />
  <button class="add-to-cart btn btn-primary" (click)="aggiungicarrello(prodotto!)">Aggiungi al carrello</button>
  <a class="cart-fab" routerLink="/shop/cart">Carrello</a>

  <app-minicart />
</div>
