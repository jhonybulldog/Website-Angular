<div class="container">
  @if (prodotto()) {
  <div class="product-overlay">
    <div class="product-nav-links">
      <a routerLink="/shop" class="nav-back-link">← Torna allo Shop</a>
    </div>
    <h2 class="product-title">{{ prodotto().title }}</h2>
    <p class="product-subtitles">{{ prodotto().description }}</p>
    <p class="product-proce">{{ prodotto().price }} €</p>
  </div>
  <img class="product-image" [src]="prodotto().thumbnail" />
  @if (loggedIn()) {
  <div class="product-actions">
    <button class="add-to-cart" (click)="aggiungicarrello(prodotto())">
      Aggiungi al carrello
    </button>
    <button class="favorite-btn" (click)="toggleFavorite()">
      {{ (isFavorite$ | async) ? "♥" : "♡" }}
    </button>
  </div>
  <a class="cart-fab" routerLink="/shop/cart">Carrello</a>
  <div class="product-sidebar">
    <app-minicart />
    <div class="edit-product">
      <h3>Modifica prodotto</h3>
      <input #prezzo type="number" [value]="prodotto().price" />
      <textarea #descrizione [value]="prodotto().description"></textarea>
      <button (click)="salva(prezzo.value, descrizione.value)">
        Salva modifica
      </button>
    </div>
  </div>
  } @else {
  <div class="product-actions">
    <a class="add-to-cart" routerLink="/login">Accedi per acquistare</a>
  </div>
  }
  } @else {
  <div class="product-not-found">
    <h2>Prodotto non trovato</h2>
    <p>Il prodotto che stai cercando non esiste.</p>
    <a routerLink="/shop"> ← Torna allo shop </a>
  </div>
  }
</div>
