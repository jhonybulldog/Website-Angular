<app-limit-selector
  [(limit)]="limit"
  (limitChange)="caricaPagina(1)"
></app-limit-selector>

<div class="blog-grid">
  @for (post of postPagina(); track post.id) {
  <app-blogcard [blog]="post"></app-blogcard>
  }
</div>

<app-pagination
  [currentpage]="paginaCorrente()"
  [numberpage]="numeroPagine()"
  (changepage)="caricaPagina($event)"
></app-pagination>
