<div class="blog-page">
  <div class="blog-header">
    <div>
      <h2>Blog</h2>
      <p>Scopri gli ultimi articoli</p>
    </div>
    <app-sort-select (changed)="order.set($event)" [options]="orderoption"></app-sort-select>
  </div>
<app-paginated-grid
  [items]="posts()"
  [total]="totale()"
  [filters]="[order()]"
  (load)="carica($event)"
>
  <ng-template let-post="items">
    <app-blogcard [blog]="post"></app-blogcard>
  </ng-template>
</app-paginated-grid>
</div>
